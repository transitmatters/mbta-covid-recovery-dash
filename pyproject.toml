[project]
name = "mbta-covid-recovery-dash"
version = "0.1.0"
description = "Tracking changes in MBTA service levels and ridership during the Covid-19 pandemic"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "boxsdk>=3.7.2,<4",
    "numpy>=1.24.3,<2",
    "openpyxl==3.1.2",
    "pandas>=1.5.3,<2",
    "pytz>=2023.3",
    "requests>=2.32.3,<3",
    "tqdm>=4.65.0,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "pre-commit>=4.4.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
